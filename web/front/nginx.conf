# Страница мониторинга и прокси к API на одном домене (без CORS).
# TLS и домен - на стороне Coolify (Traefik).
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    location / {
        try_files $uri /index.html;
        add_header Cache-Control "no-cache";
    }

    location /api/ {
        # Через переменную: nginx стартует, даже если бэкенд ещё не запущен.
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $backend http://backend:8000;
        proxy_pass $backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}
