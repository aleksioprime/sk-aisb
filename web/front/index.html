<!DOCTYPE html>
<html lang="ru">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>UMKA — мониторинг</title>
  <style>
    :root { --bg: #062f2f; --card: #0a3d3b; --line: rgba(45, 212, 191, .25); --accent: #2dd4bf;
            --text: #e6fffa; --muted: #9fbfbf; --ok: #22c55e; --off: #ef4444; }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--bg); color: var(--text); font-family: sans-serif; }
    header { padding: 16px; border-bottom: 1px solid var(--line); display: flex; gap: 16px; align-items: baseline; flex-wrap: wrap; }
    h1 { margin: 0; font-size: 22px; }
    main { max-width: 1100px; margin: 0 auto; padding: 16px; }
    .summary { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 10px; margin-bottom: 16px; }
    .card { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; }
    .card b { display: block; font-size: 26px; color: var(--accent); }
    .card span { color: var(--muted); font-size: 13px; }
    table { width: 100%; border-collapse: collapse; background: var(--card); border-radius: 12px; overflow: hidden; }
    th, td { padding: 10px 12px; text-align: left; border-bottom: 1px solid var(--line); font-size: 14px; }
    th { color: var(--muted); font-weight: normal; }
    .dot { display: inline-block; width: 10px; height: 10px; border-radius: 50%; margin-right: 6px; }
    .muted { color: var(--muted); }
    @media (max-width: 700px) { .wide { display: none; } }
    .login { max-width: 340px; margin: 12vh auto; }
    .login h2 { margin: 0 0 16px; }
    .login input { width: 100%; margin-bottom: 10px; padding: 10px 12px; border-radius: 10px; font: inherit;
                   border: 1px solid var(--line); background: #062f2f; color: var(--text); }
    .login button, .logout { padding: 10px 16px; border: 0; border-radius: 10px; font: inherit; cursor: pointer;
                             background: var(--accent); color: #062f2f; font-weight: bold; }
    .login button { width: 100%; }
    .logout { margin-left: auto; padding: 6px 12px; background: transparent; color: var(--accent);
              border: 1px solid var(--line); font-weight: normal; }
    .error { color: #fca5a5; min-height: 1.2em; margin: 8px 0 0; }
    [hidden] { display: none !important; }
  </style>
</head>

<body>
  <header>
    <h1>UMKA — сеть умных мусорок</h1>
    <span class="muted" id="updated"></span>
    <button class="logout" id="logout" hidden>Выйти</button>
  </header>
  <form class="login card" id="login" hidden>
    <h2>Вход</h2>
    <input id="username" autocomplete="username" placeholder="Логин" required>
    <input id="password" type="password" autocomplete="current-password" placeholder="Пароль" required>
    <button type="submit">Войти</button>
    <p class="error" id="login-error"></p>
  </form>
  <main id="dashboard" hidden>
    <div class="summary" id="summary"></div>
    <table>
      <thead><tr><th>Устройство</th><th>Связь</th><th class="wide">Камера / модель / моторы</th><th>Отсортировано</th></tr></thead>
      <tbody id="devices"></tbody>
    </table>
  </main>
  <script>
    const TYPES = { paper: "Бумага", plastic_aluminum: "Пластик/алюминий", organic: "Органика", non_recyclable: "Несортируемые" };
    const escape = (value) => String(value ?? "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]);
    const ok = (part) => part ? (part.ok === false ? "✕" : "✓") : "—";

    // Авторизация как в empolimer: access-токен в заголовке, refresh — чтобы
    // получить новый access, когда старый истёк (30 минут).
    const $ = (id) => document.getElementById(id);
    const tokens = {
      get access() { return localStorage.getItem("umka-access"); },
      get refresh() { return localStorage.getItem("umka-refresh"); },
      save(data) {
        if (data.access_token) localStorage.setItem("umka-access", data.access_token);
        if (data.refresh_token) localStorage.setItem("umka-refresh", data.refresh_token);
      },
      clear() { localStorage.removeItem("umka-access"); localStorage.removeItem("umka-refresh"); },
    };

    async function renewAccess() {
      if (!tokens.refresh) return false;
      const response = await fetch("/api/auth/refresh", {
        method: "POST", headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ refresh_token: tokens.refresh }),
      });
      if (!response.ok) return false;
      tokens.save(await response.json());
      return true;
    }

    async function api(path) {
      const call = () => fetch(path, { headers: { Authorization: `Bearer ${tokens.access}` } });
      let response = await call();
      if (response.status === 401 && await renewAccess()) response = await call();
      if (response.status === 401) { showLogin(); throw new Error("Нужен вход"); }
      return response.json();
    }

    function showLogin(message = "") {
      tokens.clear();
      $("dashboard").hidden = true;
      $("logout").hidden = true;
      $("login").hidden = false;
      $("updated").textContent = "";
      $("login-error").textContent = message;
    }

    async function showDashboard() {
      $("login").hidden = true;
      $("dashboard").hidden = false;
      $("logout").hidden = false;
      try {
        const me = await api("/api/auth/me");
        $("logout").textContent = `Выйти (${me.username})`;
      } catch (error) { return; }
      refresh();
    }

    $("login").addEventListener("submit", async (event) => {
      event.preventDefault();
      const response = await fetch("/api/auth/login", {
        method: "POST", headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ username: $("username").value, password: $("password").value }),
      });
      if (!response.ok) {
        $("login-error").textContent = "Неверный логин или пароль";
        return;
      }
      tokens.save(await response.json());
      $("password").value = "";
      showDashboard();
    });

    $("logout").addEventListener("click", async () => {
      if (tokens.refresh) {
        await fetch("/api/auth/logout", {
          method: "POST", headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ refresh_token: tokens.refresh }),
        }).catch(() => {});
      }
      showLogin();
    });

    async function refresh() {
      if ($("dashboard").hidden) return;
      try {
        const [devices, summary] = await Promise.all([api("/api/devices"), api("/api/summary")]);
        const online = devices.filter((d) => d.online).length;
        const cards = [[summary.devices, "устройств"], [online, "на связи"],
          ...Object.entries(summary.sortedByType).map(([type, count]) => [count, TYPES[type] || type])];
        document.getElementById("summary").innerHTML = cards.map(([value, label]) =>
          `<div class="card"><b>${escape(value)}</b><span>${escape(label)}</span></div>`).join("");
        document.getElementById("devices").innerHTML = devices.length ? devices.map((d) => {
          const s = d.status || {};
          const seen = d.lastSeen ? new Date(d.lastSeen).toLocaleString("ru-RU") : "никогда";
          return `<tr><td>${escape(d.name || d.id)}<br><span class="muted">${escape(d.id)}</span></td>
            <td><span class="dot" style="background:${d.online ? "var(--ok)" : "var(--off)"}"></span>${d.online ? "онлайн" : "нет связи"}
              <br><span class="muted">${escape(seen)}</span></td>
            <td class="wide">${ok(s.camera)} / ${ok(s.model)} / ${ok(s.hardware)} ${escape(s.hardware?.driver || "")}</td>
            <td>${escape(s.stats?.total_items ?? "—")}</td></tr>`;
        }).join("") : `<tr><td colspan="4" class="muted">Устройства ещё не присылали данных</td></tr>`;
        document.getElementById("updated").textContent = `обновлено ${new Date().toLocaleTimeString("ru-RU")}`;
      } catch (error) {
        if (!$("dashboard").hidden) $("updated").textContent = "нет связи с сервером";
      }
    }
    if (tokens.refresh) showDashboard(); else showLogin();
    setInterval(refresh, 10000);
  </script>
</body>

</html>
